name: CICD NeMo
'on':
  pull_request:
    branches:
    - main
    - r**
    types:
    - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
jobs:
  gpu-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'Run CICD' }}
    steps:
    - name: Run nvidia-smi test
      run: 'whoami

        nvidia-smi

        '
  cicd-cluster-clean:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'Run CICD' }}
    steps:
    - name: Clean server from old files
      run: 'docker container prune --filter "until=24h" --force

        docker image prune -a --filter "until=24h" --force

        '
  cicd-test-container-setup:
    needs:
    - cicd-cluster-clean
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'Run CICD' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: ${{ github.run_id }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        file: Dockerfile.ci
        push: true
        cache-from: nemoci.azurecr.io/nemo_container:latest
        cache-to: type=inline
        tags: 'nemoci.azurecr.io/nemo_container_${{ github.run_id }}

          nemoci.azurecr.io/nemo_container:latest

          '
    - name: Run some checks
      run: "docker run --rm --device=/dev/nvidia0 --gpus all --shm-size=8g --env TRANSFORMERS_OFFLINE=0\
        \ --env HYDRA_FULL_ERROR=1 --env PYTHONUNBUFFERED=1 nemoci.azurecr.io/nemo_container_${{\
        \ github.run_id }} bash -c '\\\n  # PyTorch Lightning version\n  python -c\
        \ \"import pytorch_lightning; print(pytorch_lightning.__version__)\"\n\n \
        \ # PyTorch Lightning DDP Checks\n  CUDA_VISIBLE_DEVICES=\"0,1\" python \"\
        tests/core_ptl/check_for_ranks.py\"\n\n  # Basic Import Checks\n  python -c\
        \ \"import nemo.collections.asr as nemo_asr\"\n  python -c \"import nemo.collections.nlp\
        \ as nemo_nlp\"\n  python -c \"import nemo.collections.tts as nemo_tts\"\n\
        \n  python setup.py style\n  python tests/check_copyright_header.py --dir\
        \ .\n\n  # These checks are not crucial\n  exit 0\n'\n### \\'\\'\n"
  OPTIONAL_L0_Unit_Tests_GPU:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      TIMEOUT: 30
      SCRIPT: 'NEMO_NUMBA_MINVER=0.53 pytest -m "not pleasefixme" --with_downloads

        '
      IS_OPTIONAL: true
  L0_Unit_Tests_CPU:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-cpu
      TIMEOUT: 60
      SCRIPT: 'CUDA_VISIBLE_DEVICES="" NEMO_NUMBA_MINVER=0.53 pytest -m "not pleasefixme"
        --cpu --with_downloads --relax_numba_compat

        '
  L0_Setup_Test_Data_And_Models:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python -m tests.setup --save_dir /home/TestData/nlp

        '
  L2_Community_LLM_Checkpoints_tests_Llama:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: "CUDA_VISIBLE_DEVICES=0 python scripts/checkpoint_converters/convert_llama_hf_to_nemo.py\
        \ \\\n  --input_name_or_path=/home/TestData/nlp/megatron_llama/llama-ci-hf-tiny\
        \ \\\n  --output_path=/home/TestData/nlp/megatron_llama/llama_ci.nemo \\\n\
        \  --precision=16\n"
      AFTER_SCRIPT: 'rm -rf /home/TestData/nlp/megatron_llama/model_weights

        '
  L2_Community_LLM_Checkpoints_tests_Llama3:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: "CUDA_VISIBLE_DEVICES=0 python scripts/checkpoint_converters/convert_llama_hf_to_nemo.py\
        \ \\\n  --input_name_or_path=/home/TestData/nlp/megatron_llama/llama3-ci-hf\
        \ \\\n  --output_path=/home/TestData/nlp/megatron_llama/llama3-ci-hf/llama3_ci.nemo\
        \ \\\n  --precision=16          \n"
      AFTER_SCRIPT: 'rm -f /home/TestData/nlp/megatron_llama/llama3-ci-hf/llama3_ci.nemo

        rm -rf /home/TestData/nlp/megatron_llama/llama3-ci-hf/model_weights

        '
  L2_Community_LLM_Checkpoints_tests_StarCoder:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'mkdir -p /home/TestData/nlp/megatron_gpt/starcoder-ci-hf/${{ github.run_id
        }};

        python scripts/checkpoint_converters/convert_starcoder_hf_to_nemo.py \

        --input_name_or_path /home/TestData/nlp/megatron_gpt/starcoder-ci-hf \

        --output_path /home/TestData/nlp/megatron_gpt/starcoder-ci-hf/${{ github.run_id
        }}

        '
      AFTER_SCRIPT: "rm -rf /home/TestData/nlp/megatron_gpt/starcoder-ci-hf/megatron_starcoder_tp1_pp1.nemo;\
        \ \nrm -rf /home/TestData/nlp/megatron_gpt/starcoder-ci-hf/${{ github.run_id\
        \ }}/\nrm -rf /home/TestData/nlp/megatron_gpt/starcoder-ci-hf/model_weights\n"
  L2_Community_LLM_Checkpoints_tests_Falcon:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python scripts/checkpoint_converters/convert_falcon_hf_to_nemo.py \

        --input_name_or_path /home/TestData/nlp/megatron_gpt/falcon-ci-hf \

        --output_path /home/TestData/nlp/megatron_gpt/falcon-ci-hf/falcon_ci.nemo

        rm -f /home/TestData/nlp/megatron_gpt/falcon-ci-hf/falcon_ci.nemo

        '
      AFTER_SCRIPT: 'rm -rf /home/TestData/nlp/megatron_gpt/falcon-ci-hf/model_weights

        '
  L2_PTQ_Llama2_Export_Only:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: "python examples/nlp/language_modeling/megatron_quantization.py \\\n\
        \  model_file=/home/TestData/nlp/megatron_llama/llama_ci.nemo \\\n  quantization.algorithm=null\
        \ \\\n  model_save=/home/TestData/nlp/megatron_llama/ci_baseline\n"
      AFTER_SCRIPT: 'rm -rf /home/TestData/nlp/megatron_llama/ci_baseline

        '
  L2_PTQ_Llama2_FP8:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: "python examples/nlp/language_modeling/megatron_quantization.py \\\n\
        \  model_file=/home/TestData/nlp/megatron_llama/llama_ci.nemo \\\n  tensor_model_parallel_size=2\
        \ \\\n  trainer.devices=2 \\\n  quantization.calib_dataset=/home/TestData/nlp/test_quantization/test.json\
        \ \\\n  quantization.algorithm=fp8 \\\n  quantization.num_calib_size=8 \\\n\
        \  inference.batch_size=2 \\\n  export.inference_tensor_parallel=2 \\\n  model_save=/home/TestData/nlp/megatron_llama/ci_fp8.qnemo\n"
      AFTER_SCRIPT: 'rm -rf /home/TestData/nlp/megatron_llama/ci_fp8.qnemo

        '
  L2_PTQ_Llama2_INT8_SQ:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python examples/nlp/language_modeling/megatron_quantization.py \

        model_file=/home/TestData/nlp/megatron_llama/llama_ci.nemo \

        quantization.calib_dataset=/home/TestData/nlp/test_quantization/test.json
        \

        quantization.algorithm=int8_sq \

        quantization.num_calib_size=8 \

        inference.batch_size=2 \

        model_save=/home/TestData/nlp/megatron_llama/ci_int8_sq.qnemo

        '
      AFTER_SCRIPT: 'rm -rf /home/TestData/nlp/megatron_llama/ci_int8_sq.qnemo

        '
  ASR_dev_run_Speech_to_Text:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: "python examples/asr/asr_ctc/speech_to_text_ctc.py \\\n  model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json\
        \ \\\n  model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json\
        \ \\\n  trainer.devices=1 \\\n  trainer.accelerator=\"gpu\" \\\n  +trainer.fast_dev_run=True\
        \ \\\n  exp_manager.exp_dir=examples/asr/speech_to_text_results\n"
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_text_results

        '
  ASR_dev_run_Speech_to_Text_WPE_-_CitriNet:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: "python examples/asr/asr_ctc/speech_to_text_ctc_bpe.py \\\n  --config-path=\"\
        ../conf/citrinet/\" --config-name=\"config_bpe\" \\\n  model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json\
        \ \\\n  model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json\
        \ \\\n  model.tokenizer.dir=\"/home/TestData/asr_tokenizers/an4_wpe_128/\"\
        \ \\\n  model.tokenizer.type=\"wpe\" \\\n  trainer.devices=1 \\\n  trainer.accelerator=\"\
        gpu\" \\\n  +trainer.fast_dev_run=True \\\n  exp_manager.exp_dir=examples/asr/speech_to_text_wpe_results\n"
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_text_wpe_results

        '
  ASR_dev_run_Speech_Pre-training_-_CitriNet:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/speech_pretraining/speech_pre_training.py \

        --config-path="../conf/ssl/citrinet/" --config-name="citrinet_ssl_ci" \

        model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json
        \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/asr/speech_pre_training_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_pre_training_results

        '
  ASR_dev_run_Speech_To_Text_Finetuning:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/speech_to_text_finetune.py \

        --config-path="conf/asr_finetune" --config-name="speech_to_text_finetune"
        \

        model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json
        \

        init_from_nemo_model=/home/TestData/asr/stt_en_fastconformer_transducer_large.nemo
        \

        model.tokenizer.update_tokenizer=False \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/asr/speech_finetuning_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_finetuning_results

        '
  OPTIONAL_ASR_dev_run_Speech_To_Text_HF_Finetuning:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/speech_to_text_finetune.py \

        --config-path="conf/asr_finetune" --config-name="speech_to_text_hf_finetune"
        \

        ~model.train_ds.hf_data_cfg \

        model.train_ds.num_workers=1 \

        model.train_ds.batch_size=2 model.validation_ds.batch_size=2 \

        model.train_ds.streaming=true \

        +model.train_ds.hf_data_cfg.path="librispeech_asr" \

        +model.train_ds.hf_data_cfg.name=null \

        +model.train_ds.hf_data_cfg.split="test.clean" \

        +model.train_ds.hf_data_cfg.streaming=true \

        ~model.validation_ds.hf_data_cfg \

        model.validation_ds.streaming=true \

        +model.validation_ds.hf_data_cfg.path="librispeech_asr" \

        +model.validation_ds.hf_data_cfg.name=null \

        +model.validation_ds.hf_data_cfg.split="test.clean" \

        +model.validation_ds.hf_data_cfg.streaming=true \

        ~model.test_ds \

        init_from_nemo_model=/home/TestData/asr/stt_en_fastconformer_transducer_large.nemo
        \

        model.tokenizer.update_tokenizer=False \

        model.optim.sched.warmup_steps=0 \

        +model.optim.sched.max_steps=3 \

        trainer.max_epochs=null \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/asr/speech_finetuning_results'
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_finetuning_results

        '
      IS_OPTIONAL: true
  ASR_dev_run_Speech_to_Text_WPE_-_Conformer:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/asr_ctc/speech_to_text_ctc_bpe.py \

        --config-path="../conf/conformer" --config-name="conformer_ctc_bpe" \

        model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json
        \

        model.tokenizer.dir="/home/TestData/asr_tokenizers/an4_wpe_128/" \

        model.tokenizer.type="wpe" \

        model.train_ds.batch_size=4 \

        model.validation_ds.batch_size=4 \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/asr/speech_to_text_wpe_conformer_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_text_wpe_conformer_results

        '
  ASR_dev_run-part_two_Speech_to_Text_WPE_-_Squeezeformer:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/asr_ctc/speech_to_text_ctc_bpe.py \

        --config-path="../conf/squeezeformer" --config-name="squeezeformer_ctc_bpe"
        \

        model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json
        \

        model.tokenizer.dir="/home/TestData/asr_tokenizers/an4_wpe_128/" \

        model.tokenizer.type="wpe" \

        model.encoder.d_model=144 \

        model.train_ds.batch_size=4 \

        model.validation_ds.batch_size=4 \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/asr/speech_to_text_wpe_squeezeformer_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_text_wpe_squeezeformer_results

        '
  L2_Speech_to_Text_EMA:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python examples/asr/asr_ctc/speech_to_text_ctc.py \

        model.train_ds.manifest_filepath=/home/TestData/an4_dataset/an4_train.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_dataset/an4_val.json
        \

        trainer.devices=2 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        +exp_manager.ema.enable=True \

        exp_manager.exp_dir=examples/asr/speech_to_text_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_text_results

        '
  L2_Speaker_dev_run_Speaker_Recognition:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/speaker_tasks/recognition/speaker_reco.py \

        model.train_ds.batch_size=10 \

        model.validation_ds.batch_size=2 \

        model.train_ds.manifest_filepath=/home/TestData/an4_speaker/train.json \

        model.validation_ds.manifest_filepath=/home/TestData/an4_speaker/dev.json
        \

        model.decoder.num_classes=2 \

        trainer.max_epochs=10 \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/speaker_tasks/recognition/speaker_recognition_results

        '
      AFTER_SCRIPT: 'rm -rf examples/speaker_tasks/recognition/speaker_recognition_results

        '
  L2_Speaker_dev_run_Speaker_Diarization:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/speaker_tasks/diarization/neural_diarizer/multiscale_diar_decoder.py
        \

        model.diarizer.speaker_embeddings.model_path=titanet_large \

        model.train_ds.batch_size=5 \

        model.validation_ds.batch_size=5 \

        model.train_ds.emb_dir=examples/speaker_tasks/diarization/speaker_diarization_results
        \

        model.validation_ds.emb_dir=examples/speaker_tasks/diarization/speaker_diarization_results
        \

        model.train_ds.manifest_filepath=/home/TestData/an4_diarizer/simulated_train/msdd_data.50step.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/an4_diarizer/simulated_valid/msdd_data.50step.json
        \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        exp_manager.exp_dir=examples/speaker_tasks/diarization/speaker_diarization_results

        '
      AFTER_SCRIPT: 'rm -rf examples/speaker_tasks/diarization/speaker_diarization_results

        '
  L2_Speaker_dev_run_Speech_to_Label:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure-gpus-1
      SCRIPT: 'python examples/asr/speech_classification/speech_to_label.py \

        model.train_ds.manifest_filepath=/home/TestData/speech_commands/train_manifest.json
        \

        model.validation_ds.manifest_filepath=/home/TestData/speech_commands/test_manifest.json
        \

        model.test_ds.manifest_filepath=/home/TestData/speech_commands/test_manifest.json
        \

        trainer.devices=1 \

        trainer.accelerator="gpu" \

        +trainer.fast_dev_run=True \

        model.preprocessor._target_=nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
        \

        ~model.preprocessor.window_size \

        ~model.preprocessor.window_stride \

        ~model.preprocessor.window \

        ~model.preprocessor.n_mels \

        ~model.preprocessor.n_mfcc \

        ~model.preprocessor.n_fft \

        exp_manager.exp_dir=examples/asr/speech_to_label_results

        '
      AFTER_SCRIPT: 'rm -rf examples/asr/speech_to_label_results

        '
  L2_Speaker_dev_run_Speaker_Diarization_with_ASR_Inference:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python examples/speaker_tasks/diarization/clustering_diarizer/offline_diar_with_asr_infer.py
        \

        diarizer.manifest_filepath=/home/TestData/an4_diarizer/an4_manifest.json \

        diarizer.speaker_embeddings.model_path=/home/TestData/an4_diarizer/spkr.nemo
        \

        diarizer.speaker_embeddings.parameters.save_embeddings=True \

        diarizer.speaker_embeddings.parameters.window_length_in_sec=[1.5] \

        diarizer.speaker_embeddings.parameters.shift_length_in_sec=[0.75] \

        diarizer.speaker_embeddings.parameters.multiscale_weights=[1.0] \

        diarizer.asr.model_path=QuartzNet15x5Base-En \

        diarizer.asr.parameters.asr_based_vad=True \

        diarizer.out_dir=examples/speaker_tasks/diarization/speaker_diarization_asr_results

        '
      AFTER_SCRIPT: 'rm -rf examples/speaker_tasks/diarization/speaker_diarization_asr_results

        '
  L2_Speaker_dev_run_Clustering_Diarizer_Inference:
    needs:
    - cicd-test-container-setup
    uses: ./.github/workflows/_test_template.yml
    with:
      RUNNER: self-hosted-azure
      SCRIPT: 'python examples/speaker_tasks/diarization/clustering_diarizer/offline_diar_infer.py
        \

        diarizer.manifest_filepath=/home/TestData/an4_diarizer/an4_manifest.json \

        diarizer.speaker_embeddings.model_path=/home/TestData/an4_diarizer/spkr.nemo
        \

        diarizer.speaker_embeddings.parameters.save_embeddings=True \

        diarizer.speaker_embeddings.parameters.window_length_in_sec=1.5 \

        diarizer.speaker_embeddings.parameters.shift_length_in_sec=0.75 \

        diarizer.speaker_embeddings.parameters.multiscale_weights=null \

