    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: ${{ always() }}
      id: pipeline-conclusion
      run: '# Slack notifications are send only on test failure (not cancelled):

        FAILED=${{ contains(needs.*.outputs.conclusion, ''failure'') }}

        echo "FAILED=$FAILED" >> $GITHUB_OUTPUT


        # Mark as successful if no job was cancelled:

        SUCCESS=${{ !contains(needs.*.result, ''cancelled'') }}

        echo "SUCCESS=$SUCCESS" >> $GITHUB_OUTPUT

        '
    - if: ${{ always() && steps.pipeline-conclusion.outputs.SUCCESS == 'true' }}
      run: exit 0
    - if: ${{ always() && steps.pipeline-conclusion.outputs.FAILED == 'true' }}
      name: Checkout repository
      uses: actions/checkout@v4
    - if: ${{ always() && steps.pipeline-conclusion.outputs.FAILED == 'true' }}
      run: "set -x\n\nPR_INFO=$(curl -L \\\n  -H \"Accept: application/vnd.github+json\"\
        \ \\\n  -H \"Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}\" \\\n  -H\
        \ \"X-GitHub-Api-Version: 2022-11-28\" \\\n  https://api.github.com/repos/${{\
        \ github.repository }}/pulls/${{ github.event.number }}\n)\nPR_URL=$(echo\
        \ -E $PR_INFO | jq '.html_url' | tr -d '\"')\nPR_TITLE=$(echo -E $PR_INFO\
        \ | jq '.title' | tr -d '\"')\n\nPIPELINE_URL=${{ github.server_url }}/${{\
        \ github.repository }}/actions/runs/${{ github.run_id }}\nBASE_MESSAGE='\n\
        \  {\n    \"blocks\": [\n      {\n        \"type\": \"section\",\n       \
        \ \"text\": {\n          \"type\": \"mrkdwn\",\n          \"text\": \"\U0001F6A8\
        \ *CI/CD failure at <'$PIPELINE_URL'|NeMo CI>*.\"\n        }\n      }\n  \
        \  ]\n  }\n'\n\n# We are close to reaching 100 jobs: Once we break that barrier,\
        \ we have to iterate pages\nJOBS_URL=\"https://api.github.com/repos/${{ github.repository\
        \ }}/actions/runs/${{ github.run_id }}/jobs?per_page=100\"  \nSUMMARY=\"[]\"\
        \nwhile IFS= read -r JOB; do\n  JOB_NAME=\"$(echo $JOB | jq '.key' | tr -d\
        \ '\"') / main\"\n  JOB_ID=$(curl -s -H \"Authorization: token ${{ secrets.GITHUB_TOKEN\
        \ }}\" $JOBS_URL | jq --arg job_name \"$JOB_NAME\" -r '.jobs[] | select(.name\
        \ == $job_name) | .id')\n  JOB_URL=\"https://github.com/${{ github.repository\
        \ }}/actions/runs/${{ github.run_id }}/job/$JOB_ID\"\n\n  LOGS=$(echo $JOB\
        \ | yq '(.value.outputs.log | @base64d)' | tr -d '\"')\n\n  SUMMARY=$(echo\
        \ \"$SUMMARY\" | jq \\\n    --arg pr \"<$PR_URL|$PR_TITLE>\" \\\n    --arg\
        \ job \"<$JOB_URL|$JOB_NAME>\" \\\n    --arg logs \"$LOGS\" \\\n    --arg\
        \ author \"<https://github.com/${{ github.actor }}|${{ github.actor }}>\"\
        \ \\\n    --arg branch \"<https://github.com/${{ github.repository }}/tree/${{\
        \ github.head_ref || github.ref_name }}|${{ github.head_ref || github.ref_name\
        \ }}>\"\\\n    '. += [\n    {\n      \"type\": \"section\",\n      \"text\"\
        : {\n        \"type\": \"mrkdwn\",\n        \"text\": (\n          \"PR: \"\
        \ + $pr\n          + \"\\nJob: \" + $job\n          + \"\\nAuthor: \" + $author\n\
        \          + \"\\nBranch: \" + $branch\n          + \"\\nLogs:\" \n      \
        \    + \"```\\n\" + $logs + \"\\n```\" \n        )\n      }\n    }\n  ]')\n\
        done <<<$(echo '${{ toJSON(needs) }}' | jq -c 'to_entries | .[] | select(.value.outputs.conclusion\
        \ == \"failure\")')\n\nMESSAGE=$(echo $BASE_MESSAGE | jq -c --argjson summary\
        \ \"$SUMMARY\" '.blocks += $summary')\n\ncurl -X POST -H \"Content-type: application/json\"\
        \ --data \"$MESSAGE\" ${{ secrets.SLACK_WEBHOOK }}\n"
    - if: ${{ always() && steps.pipeline-conclusion.outputs.SUCCESS == 'false' }}
      run: 'exit 1

        '
