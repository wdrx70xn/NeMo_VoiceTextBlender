        model.megatron_amp_O2=True \

        trainer.gradient_clip_val=1.0 \

        exp_manager.exp_dir=examples/nlp/language_modeling/bert_pretrain_results \

        model.tensor_model_parallel_size=2 \

        model.optim.name=fused_adam \

